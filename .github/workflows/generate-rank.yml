name: Generate Rank Card

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:        # allow manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # required to push rank-card/rank.svg back to repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Rank SVG
        env:
          # Use GH_TOKEN (PAT with read:user) if set, else fall back to GITHUB_TOKEN.
          # With GITHUB_TOKEN: commit counts are unavailable (integration restriction),
          # but the rank card still generates using stars/PRs/issues/followers.
          # To enable full commit counts: add a PAT with read:user scope as secret GH_TOKEN.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-rank.js

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rank-card/rank.svg rank-card/stats.json rank-card/github-stats.svg
          git diff --cached --quiet && echo "No changes." || git commit -m "chore: update rank card and stats [skip ci]"
          git push
