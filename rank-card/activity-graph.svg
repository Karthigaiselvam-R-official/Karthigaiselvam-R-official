  <rect x="0" y="0" width="100%" height="100%" rx="0" fill="#000000" stroke="none"/>
  <style>
    body { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; }
    .header { font: 600 20px 'Segoe UI', Ubuntu, Sans-Serif; text-align: center; color: #FEE75C; margin-top: 20px; }
    svg { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; user-select: none; }
    
    .ct-label { fill: #FEE75C; font-size: 14px; line-height: 1; text-anchor: middle; }
    .ct-vertical.ct-start { text-anchor: end; }
    .ct-grid { stroke: #FEE75C; stroke-width: 1px; stroke-opacity: 0.3; stroke-dasharray: 2px; }
    
    .ct-point {
      stroke-width: 10px;
      stroke-linecap: round;
      stroke: #FEE75C;
      animation: blink 1s ease-in-out forwards;
      opacity: 0;
    }
    .ct-line {
      stroke-width: 4px;
      stroke-dasharray: 5000;
      stroke-dashoffset: 5000;
      stroke: #00fffa;
      animation: dash 5s ease-in-out forwards;
      fill: none;
    }
    .ct-area {
      stroke: none;
      fill-opacity: 0.1;
      fill: #00fffa;
    }
    
    @keyframes dash {
      from { stroke-dashoffset: 5000; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes blink {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>

